name = "Colean"
version = "0.1.0"
license = "Apache-2.0"
defaultTargets = ["Colean"]
# The tests: `lake test` (and CI) builds them, a bare `lake build` does not.
testDriver = "ColeanTest"
# The files are not modules (no `module` header), while Mathlib is designed for the module system.
allowNonModules = true

[[lean_lib]]
name = "Colean"

[[lean_lib]]
name = "ColeanTest"

# Hand-written experiments, not part of the default build: `lake build Sketch`.
[[lean_lib]]
name = "Sketch"
globs = ["Sketch.+"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.36.0-rc2"
